on:
  push:
    tags:
    - '*'
  workflow_dispatch:

name: ftpu-toolchain

permissions: write-all

jobs:
  job0:
    name: Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build project
        run: |
          sudo ln -snf /bin/bash /bin/sh
          sudo mkdir -p /opt/ftpu
          sudo mount --bind "${{ github.workspace }}" /opt/ftpu
          mkdir -p "${{ github.workspace }}/../ftpu-build"
          make USETAR=1 -C "${{ github.workspace }}/../ftpu-build/" -f "${{ github.workspace }}/makefile" all > "${{ github.workspace }}/build.log"
          mv "${{ github.workspace }}/../ftpu-build/ftpu-toolchain.tar.xz" "${{ github.workspace }}/ftpu-toolchain-linux-x64.tar.xz"
      - name: Save build.log
        uses: actions/upload-artifact@v7
        with:
          path: build.log
          name: build.log
          if-no-files-found: error
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ftpu-toolchain-linux-x64.tar.xz
